name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP (Pint, Larastan, Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, intl
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts && composer dump-autoload

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Pest
        run: php artisan test --compact --testsuite=Unit,Feature

  browser:
    name: Browser tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Shards are balanced by the per-file timings in tests/.pest/shards.json; refresh them with
        # `vendor/bin/pest --testsuite=Browser --update-shards` only when a new browser test file is added.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, intl
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts && composer dump-autoload
          npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Pest (browser)
        run: vendor/bin/pest --testsuite=Browser --parallel --shard=${{ matrix.shard }}/2

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots-${{ matrix.shard }}
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  frontend:
    name: Frontend (ESLint, Prettier, vue-tsc, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # The frontend build reads Ziggy's routes helper from vendor/.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          npm ci

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check resources/

      - name: Type check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
