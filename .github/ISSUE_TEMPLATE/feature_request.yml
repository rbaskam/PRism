name: Feature request
description: Suggest an improvement or a new feature for PRism.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
      placeholder: I review pull requests across a dozen repositories and lose track of which ones I've only commented on.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like PRism to do?
      placeholder: Keep pull requests in Awaiting your review until I approve or request changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md).
