name: Bug report
description: Something in PRism doesn't work the way it should.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Found a security problem? Don't open an issue:** report it privately as described in [SECURITY.md](https://github.com/rbaskam/PRism/blob/main/SECURITY.md).

        Please leave out anything private: tokens, API keys, your PIN, private repository or organisation names, pull request titles and people's names. Describe them generically instead, e.g. "a pull request requested through a team".
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
      placeholder: When I approve a pull request from the review dialog, it stays in Awaiting your review until I restart the app.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open My pull requests
        2. Open a pull request awaiting your review
        3. Approve it
        4. Go back to My pull requests
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PRism version
      description: Shown in Settings → About.
      placeholder: 0.18.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Running from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Anything PRism showed, or relevant lines from its log. Check them for tokens and private names first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I've removed tokens, keys and private names (repositories, organisations, people, pull request titles) from this report.
          required: true
